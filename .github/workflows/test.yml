name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Run all tests except canary (network-dependent) and CDK.
      # Testcontainers will automatically use the pre-installed Docker daemon.
      - name: Run tests
        run: go test -short -count=1 -coverprofile=coverage.out $(go list ./... | grep -v infra)

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go

  cdk-test:
    name: CDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install CDK dependencies
        run: cd deploy/aws/infra && npm ci

      - name: Run CDK tests
        run: cd deploy/aws/infra && npx jest --coverage

      - name: Upload CDK coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: cdk
