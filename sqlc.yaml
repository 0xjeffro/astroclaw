version: "2"
# TODO: add a CI workflow (.github/workflows/sqlc-check.yml) that runs
# [Done]`sqlc generate` and then `git diff --exit-code` on every PR, and register
# the job as a required status check in branch protection. This ensures
# that any schema/queries change is regenerated and committed before merge,
# and indirectly catches missing type overrides via the follow-up `go build`.
#
# [Done]Also add a registry check: a script that scans pkg/app/*/db/schema.sql and
# verifies every file is registered in this sqlc.yaml. Otherwise a brand-new
# app is silently skipped (sqlc generate does nothing, git diff passes).
#
# For final enforcement: a workflow that requires a "schema-reviewed" label
# on PRs touching schema.sql. Reviewer adds the label only after confirming
# sqlc.yaml / atlas.hcl were updated correctly. Combined with branch
# protection, this blocks merge until human review of the registry change.
sql:
  - engine: "postgresql"
    queries: "pkg/app/chat/db/queries.sql"
    schema: "pkg/app/chat/db/schema.sql"
    gen:
      go:
        package: "db"
        out: "pkg/app/chat/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "string"
            nullable: false
          - db_type: "uuid"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
            nullable: false
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
  - engine: "postgresql"
    queries: "pkg/app/passwords/db/queries.sql"
